[tool.poetry]
name = "tripmate"
version = "0.1.0"
description = "AI-powered trip planning assistant"
authors = ["Manas <manas@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
langchain = "^0.3"
langchain-google-genai = "^2.0"
langchain-community = "^0.3"
langgraph = "^0.4"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
streamlit = "^1.40"
sqlalchemy = "^2.0"
alembic = "^1.13"
httpx = "^0.27"
python-dotenv = "^1.0"
pydantic = "^2.9"
pydantic-settings = "^2.5"
faiss-cpu = "^1.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
